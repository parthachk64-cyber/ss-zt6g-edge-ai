name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests with coverage
        run: pytest --cov=sszt6g --cov-report=term-missing
      - name: Offline demo, smoke size
        run: sszt6g demo --smoke --run-id ci --out "$RUNNER_TEMP/run" --docs "$RUNNER_TEMP/docs"
      - name: Verify the demo's audit log against its signed checkpoint
        run: |
          sszt6g verify-ledger --path "$(ls $RUNNER_TEMP/run/audit/*ramp_burst*predictive.audit.jsonl | head -1)" \
            --checkpoint "$(ls $RUNNER_TEMP/run/audit/*ramp_burst*predictive.checkpoint.json | head -1)"
