[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sszt6g"
version = "0.1.0"
description = "Independent, offline Python research companion for an SS-ZT6G-style zero-touch edge orchestration study: simulator, predictive planner, zero-trust policy checks and an audit ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Partha Chakraborty" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "cryptography>=42",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
sszt6g = "sszt6g.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sszt6g"]
branch = false
